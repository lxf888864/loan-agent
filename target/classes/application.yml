server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:loan_agent;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

llm:
  provider: zhipu
  model: ${ZHIPU_MODEL:glm-5.1}
  api-key: ${ZHIPU_API_KEY:bb219c280c2a45858c7d7a4e0cc5d9b1.BlNcteYz3Vl9mehO}
  base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  timeout:
    connect: 5000
    read: 30000

agent:
  max-steps: 8
  async:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 200

resilience4j:
  ratelimiter:
    instances:
      llm-api:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 3s
  circuitbreaker:
    instances:
      llm-api:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
